<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" role="img" aria-labelledby="title desc"><title id="title">Argus vision triage pipeline</title><desc id="desc">Camera streams are prepared into frames, evaluated by a multimodal model, and delivered as triage cases for human operators.</desc><style>text{font-family:Inter,Arial;fill:#e3e4ea}.n{fill:#11122f;stroke:#a3d4ad;stroke-width:2}.a{stroke:#a3d4ad;stroke-width:3}.h{font-size:20px;font-weight:700}.s{fill:#b5b6c4;font-size:14px}</style><rect width="1000" height="220" rx="14" fill="#10131a"/><g transform="translate(25 70)"><rect class="n" width="185" height="84" rx="9"/><text x="22" y="37" class="h">Camera stream</text><text x="22" y="62" class="s">stream-gateway</text></g><path d="M210 112H270M460 112H520M710 112H770" class="a"/><g transform="translate(270 70)"><rect class="n" width="190" height="84" rx="9"/><text x="22" y="37" class="h">Frame prep</text><text x="22" y="62" class="s">Redis + MinIO</text></g><g transform="translate(520 70)"><rect class="n" width="190" height="84" rx="9"/><text x="22" y="37" class="h">prompt-eval</text><text x="22" y="62" class="s">live VLM</text></g><g transform="translate(770 70)"><rect class="n" width="190" height="84" rx="9"/><text x="22" y="37" class="h">HITL triage</text><text x="22" y="62" class="s">API + WebSocket</text></g></svg>
