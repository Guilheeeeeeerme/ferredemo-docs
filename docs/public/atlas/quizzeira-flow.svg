<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" role="img" aria-labelledby="title desc"><title id="title">Quizzeira study pipeline</title><desc id="desc">Public exams are ingested, transformed into a draft question bank, evaluated, and sampled into study pills.</desc><style>text{font-family:Inter,Arial;fill:#e3e4ea}.n{fill:#11122f;stroke:#a3d4ad;stroke-width:2}.a{stroke:#a3d4ad;stroke-width:3}.h{font-size:20px;font-weight:700}.s{fill:#b5b6c4;font-size:14px}</style><rect width="1000" height="220" rx="14" fill="#10131a"/><g transform="translate(25 70)"><rect class="n" width="185" height="84" rx="9"/><text x="22" y="37" class="h">Ingestion</text><text x="22" y="62" class="s">public exams</text></g><path d="M210 112H270M460 112H520M710 112H770" class="a"/><g transform="translate(270 70)"><rect class="n" width="190" height="84" rx="9"/><text x="22" y="37" class="h">Content plane</text><text x="22" y="62" class="s">draft bank</text></g><g transform="translate(520 70)"><rect class="n" width="190" height="84" rx="9"/><text x="22" y="37" class="h">Eval gate</text><text x="22" y="62" class="s">publish confidence</text></g><g transform="translate(770 70)"><rect class="n" width="190" height="84" rx="9"/><text x="22" y="37" class="h">Study pills</text><text x="22" y="62" class="s">sampling + grading</text></g></svg>
