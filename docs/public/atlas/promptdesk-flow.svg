<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" role="img" aria-labelledby="title desc"><title id="title">PromptDesk support flow</title><desc id="desc">A customer request passes through the API and chat worker before model selection, persistence, and status updates reach the support interface.</desc><style>text{font-family:Inter,Arial;fill:#e3e4ea}.n{fill:#11122f;stroke:#a3d4ad;stroke-width:2}.a{stroke:#a3d4ad;stroke-width:3}.h{font-size:20px;font-weight:700}.s{fill:#b5b6c4;font-size:14px}</style><rect width="1000" height="220" rx="14" fill="#10131a"/><g transform="translate(35 70)"><rect class="n" width="160" height="84" rx="9"/><text x="22" y="37" class="h">Support MFE</text><text x="22" y="62" class="s">customer context</text></g><path d="M195 112H270M445 112H520M695 112H770" class="a"/><g transform="translate(270 70)"><rect class="n" width="175" height="84" rx="9"/><text x="22" y="37" class="h">NestJS API</text><text x="22" y="62" class="s">queue + session</text></g><g transform="translate(520 70)"><rect class="n" width="175" height="84" rx="9"/><text x="22" y="37" class="h">chat-worker</text><text x="22" y="62" class="s">ranked LLM call</text></g><g transform="translate(770 70)"><rect class="n" width="190" height="84" rx="9"/><text x="22" y="37" class="h">Answer + status</text><text x="22" y="62" class="s">Redis → Socket.IO</text></g></svg>
